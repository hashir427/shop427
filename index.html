<!DOCTYPE html>
<html lang="en">
<head>
  <title>Naya Bill - Kisan Vet</title>
  <!-- PWA & Mobile Icon Links -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-3">
  <div class="row g-3">
    <!-- Products Selection Section -->
    <div class="col-lg-7">
      <input id="s" class="form-control form-control-lg mb-3" placeholder="Dawai ya feed search karein...">
      <div id="g" class="row g-2"></div>
    </div>

    <!-- Billing Cart Section -->
    <div class="col-lg-5">
      <div class="card">
        <div class="card-body">
          <h5 class="text-em mb-3"><i class="bi bi-cart3"></i> Billing Cart</h5>
          
          <div class="table-responsive" style="max-height:34vh;overflow:auto">
            <table class="table table-sm align-middle">
              <thead>
                <tr>
                  <th>Item</th>
                  <th style="width:80px">Qty</th>
                  <th>Rate</th>
                  <th>Total</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="cart"></tbody>
            </table>
          </div>

          <!-- Customer Selection with Dropdown List -->
          <div class="card bg-light p-2 my-2 border">
            <div class="fw-semibold small text-muted mb-1"><i class="bi bi-person-fill"></i> Customer Ki Maloomat:</div>
            <div class="row g-2">
              <div class="col-6">
                <input id="cn" class="form-control form-control-sm" list="custList" placeholder="Customer name likhein ya select karein" oninput="onCustomerSelect(this.value)">
                <datalist id="custList"></datalist>
              </div>
              <div class="col-6">
                <input id="cp" class="form-control form-control-sm" placeholder="Mobile 03XXXXXXXXX">
              </div>
            </div>
            <div id="prev_bal_box" class="small mt-1 text-danger fw-semibold d-none">
              Purana Udhaar Balance: <span id="prev_bal">Rs 0</span>
            </div>
          </div>

          <!-- Total Bill Display -->
          <div class="d-flex justify-content-between fs-5 fw-bold mt-2">
            <span>Total Bill</span>
            <span id="tot">Rs 0</span>
          </div>

          <!-- Payment Input & Shortcuts -->
          <div class="input-group my-2">
            <span class="input-group-text">Naqad Paid</span>
            <input id="pd" type="number" min="0" class="form-control" placeholder="0">
            <button type="button" class="btn btn-outline-success" onclick="fullCash()">Poora Naqad</button>
            <button type="button" class="btn btn-outline-danger" onclick="fullUdhaar()">Poora Udhaar</button>
          </div>

          <!-- Udhaar Summary -->
          <div class="d-flex justify-content-between fs-5 fw-bold text-danger">
            <span>Is Bill Ka Udhaar</span>
            <span id="ud">Rs 0</span>
          </div>

          <button id="done" class="btn btn-em btn-lg w-100 mt-3" onclick="done()">
            <i class="bi bi-check2-circle"></i> Bill Mukammal Karein
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
renderNav('index.html');
let P = [], cart = [], custList = [], touched = false;

async function load() {
  try {
    const [products, customers] = await Promise.all([
      ok(db.from('kisan_vet_products').select('*').order('name')),
      ok(db.from('kisan_vet_customers').select('*').order('name'))
    ]);
    P = products;
    custList = customers;
    
    const dl = document.getElementById('custList');
    if (dl) {
      dl.innerHTML = custList.map(c => `<option value="${esc(c.name)}">${c.phone ? esc(c.phone) : 'No Phone'} | Khata: ${rs(c.khata_balance)}</option>`).join('');
    }
    grid();
  } catch (e) {
    toast(e.message, false);
  }
}

function onCustomerSelect(val) {
  const match = custList.find(c => c.name.toLowerCase() === val.trim().toLowerCase());
  const balBox = document.getElementById('prev_bal_box');
  const balSpan = document.getElementById('prev_bal');
  
  if (match) {
    if (match.phone) cp.value = match.phone;
    if (match.khata_balance > 0) {
      balBox.classList.remove('d-none');
      balSpan.textContent = rs(match.khata_balance);
    } else {
      balBox.classList.add('d-none');
    }
  } else {
    balBox.classList.add('d-none');
  }
}

function grid() {
  const q = s.value.toLowerCase();
  g.innerHTML = P.filter(p => p.name.toLowerCase().includes(q)).map(p => `
    <div class="col-6 col-md-4">
      <div class="card pcard h-100 ${p.stock_qty <= 0 ? 'opacity-50' : ''}" onclick="add(${p.id})">
        <div class="card-body p-2">
          <span class="badge ${p.category == 'Medicine' ? 'bg-info text-dark' : 'bg-warning text-dark'}">${p.category}</span>
          <div class="fw-semibold mt-1">${esc(p.name)}</div>
          <div class="text-em fw-bold">${rs(p.sale_price)}/${esc(p.unit)}</div>
          <span class="badge ${p.stock_qty <= p.min_limit ? 'bg-danger' : 'bg-success'}">Stock: ${p.stock_qty}</span>
        </div>
      </div>
    </div>
  `).join('') || '<p class="text-muted p-2">Koi item nahi mila. Pehle stock.html mein item add karein.</p>';
}

function add(id) {
  const p = P.find(x => x.id == id), c = cart.find(x => x.id == id);
  if (p.stock_qty <= 0) return toast('Stock khatam hai', false);
  if (c) {
    if (c.qty + 1 > p.stock_qty) return toast('Itna stock nahi hai', false);
    c.qty++;
  } else {
    cart.push({ id: p.id, name: p.name, unit: p.unit, price: +p.sale_price, cost: +p.cost_price, qty: 1 });
  }
  draw();
}

function setQty(i, v) {
  const p = P.find(x => x.id == cart[i].id);
  v = +v;
  if (v > p.stock_qty) {
    toast('Itna stock nahi hai', false);
    v = p.stock_qty;
  }
  cart[i].qty = v > 0 ? v : 1;
  draw();
}

function setPrice(i, v) {
  cart[i].price = +v || 0;
  draw();
}

function del(i) {
  cart.splice(i, 1);
  draw();
}

const total = () => cart.reduce((a, c) => a + c.price * c.qty, 0);

function draw() {
  cart_.innerHTML = cart.map((c, i) => `
    <tr>
      <td>${esc(c.name)}</td>
      <td><input type="number" min="0.1" step="any" class="form-control form-control-sm" value="${c.qty}" onchange="setQty(${i},this.value)"></td>
      <td><input type="number" class="form-control form-control-sm" value="${c.price}" onchange="setPrice(${i},this.value)"></td>
      <td>${rs(c.price * c.qty)}</td>
      <td><button class="btn btn-sm text-danger" onclick="del(${i})"><i class="bi bi-x-lg"></i></button></td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="text-muted text-center">Cart khali hai</td></tr>';

  if (!touched) pd.value = total();
  calc();
}

function calc() {
  const t = total();
  tot.textContent = rs(t);
  ud.textContent = rs(Math.max(t - (+pd.value || 0), 0));
}

function fullCash() {
  touched = true;
  pd.value = total();
  calc();
}

function fullUdhaar() {
  touched = true;
  pd.value = 0;
  calc();
}

pd.oninput = () => { touched = true; calc(); };
s.oninput = grid;

async function done() {
  if (!cart.length) return toast('Cart khali hai', false);
  const t = total(), paid = Math.min(Math.max(+pd.value || 0, 0), t), u = t - paid;
  const name = cn.value.trim(), phone = cp.value.trim();

  if (u > 0 && !name && !phone) {
    return toast('Udhaar ke liye customer ka naam ya number likhna zaroori hai', false);
  }

  done_.disabled = true;
  try {
    for (const c of cart) {
      const p = await ok(db.from('kisan_vet_products').select('stock_qty,name').eq('id', c.id).single());
      if (+p.stock_qty < c.qty) throw new Error('Stock kam hai: ' + p.name);
    }

    let cid = null;
    if (name || phone) {
      let q = db.from('kisan_vet_customers').select('*');
      q = phone ? q.eq('phone', phone) : q.eq('name', name);
      const ex = await ok(q.limit(1).maybeSingle());

      if (ex) {
        cid = ex.id;
        await ok(db.from('kisan_vet_customers').update({
          khata_balance: +ex.khata_balance + u,
          name: name || ex.name,
          phone: phone || ex.phone
        }).eq('id', cid));
      } else {
        const n = await ok(db.from('kisan_vet_customers').insert({
          name: name || phone,
          phone: phone || null,
          khata_balance: u
        }).select().single());
        cid = n.id;
      }
    }

    for (const c of cart) {
      const p = await ok(db.from('kisan_vet_products').select('stock_qty').eq('id', c.id).single());
      await ok(db.from('kisan_vet_products').update({ stock_qty: +p.stock_qty - c.qty }).eq('id', c.id));
    }

    await ok(db.from('kisan_vet_sales').insert({
      customer_id: cid,
      customer_name: name || 'Walk-in',
      total_amount: t,
      cash_paid: paid,
      udhaar_amount: u,
      items: cart.map(c => ({ id: c.id, name: c.name, unit: c.unit, qty: c.qty, price: c.price, cost: c.cost, total: c.price * c.qty }))
    }));

    toast('Bill save ho gaya: ' + rs(t));
    cart = [];
    cn.value = cp.value = '';
    document.getElementById('prev_bal_box').classList.add('d-none');
    touched = false;
    await load();
    draw();
  } catch (e) {
    toast(e.message || 'Error', false);
  }
  done_.disabled = false;
}

const cart_ = document.getElementById('cart'), done_ = document.getElementById('done');
window.done = done;
window.fullCash = fullCash;
window.fullUdhaar = fullUdhaar;
load();
draw();
</script>
</body>
</html>
