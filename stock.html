<!DOCTYPE html><html lang="en"><head><title>Stock & Godown - Kisan Vet</title>
    <!-- PWA & Mobile Icon Links -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet"></head><body>
<div class="container py-3">
<div class="card mb-3"><div class="card-body"><h5 class="text-em"><i class="bi bi-plus-circle"></i> Naya Item Add Karein</h5>
<div class="row g-2">
<div class="col-md-3"><input id="n" class="form-control" placeholder="Item name"></div>
<div class="col-md-2"><select id="c" class="form-select"><option>Medicine</option><option>Feed</option></select></div>
<div class="col-md-1"><input id="u" class="form-control" placeholder="Unit" value="pcs"></div>
<div class="col-md-2"><input id="cp" type="number" class="form-control" placeholder="Cost Price"></div>
<div class="col-md-2"><input id="sp" type="number" class="form-control" placeholder="Sale Price"></div>
<div class="col-md-1"><input id="q" type="number" class="form-control" placeholder="Qty"></div>
<div class="col-md-1"><button class="btn btn-em w-100" onclick="addItem()">Add</button></div></div></div></div>
<input id="s" class="form-control mb-2" placeholder="Search stock...">
<div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Item</th><th>Type</th><th>Cost</th><th>Sale</th><th>Stock</th><th style="width:130px"></th></tr></thead><tbody id="t"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
renderNav('stock.html');let P=[];
async function load(){try{P=await ok(db.from('kisan_vet_products').select('*').order('name'));draw()}catch(e){toast(e.message,false)}}
function draw(){const q=s.value.toLowerCase();t.innerHTML=P.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<tr><td class="fw-semibold">${esc(p.name)}<div class="small text-muted">${esc(p.unit)}</div></td><td><span class="badge ${p.category=='Medicine'?'bg-info text-dark':'bg-warning text-dark'}">${p.category}</span></td>
<td><input id="c${p.id}" type="number" class="form-control form-control-sm" value="${p.cost_price}"></td><td><input id="s${p.id}" type="number" class="form-control form-control-sm" value="${p.sale_price}"></td>
<td><input id="q${p.id}" type="number" step="any" class="form-control form-control-sm ${p.stock_qty<=p.min_limit?'border-danger':''}" value="${p.stock_qty}"></td>
<td><button class="btn btn-sm btn-em" onclick="save(${p.id})"><i class="bi bi-save"></i></button> <button class="btn btn-sm btn-outline-danger" onclick="rm(${p.id})"><i class="bi bi-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="6" class="text-center text-muted">Koi item nahi</td></tr>'}
async function addItem(){const name=n.value.trim();if(!name)return toast('Item name likhein',false);
try{await ok(db.from('kisan_vet_products').insert({name,category:c.value,unit:u.value.trim()||'pcs',cost_price:+cp.value||0,sale_price:+sp.value||0,stock_qty:+q.value||0}));toast('Item add ho gaya');n.value=cp.value=sp.value=q.value='';load()}catch(e){toast(e.message,false)}}
async function save(id){try{await ok(db.from('kisan_vet_products').update({cost_price:+document.getElementById('c'+id).value||0,sale_price:+document.getElementById('s'+id).value||0,stock_qty:+document.getElementById('q'+id).value||0}).eq('id',id));toast('Update ho gaya');load()}catch(e){toast(e.message,false)}}
async function rm(id){if(!confirm('Yeh item delete karna hai?'))return;try{await ok(db.from('kisan_vet_products').delete().eq('id',id));toast('Delete ho gaya');load()}catch(e){toast(e.message,false)}}
s.oninput=draw;load();
</script></body></html>
