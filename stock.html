<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stock Management - Kisan Vet</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .bag-badge {
      font-size: 11.5px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      padding: 2px 6px;
      display: inline-block;
      margin-top: 3px;
    }
    .med-badge {
      font-size: 11.5px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 2px 6px;
      display: inline-block;
      margin-top: 3px;
    }
  </style>
</head>
<body>
<div class="container py-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div class="flex-grow-1">
      <input id="s" class="form-control" placeholder="Dawai, khal ya murghi feed search karein...">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-em text-nowrap" data-bs-toggle="modal" data-bs-target="#newProductModal">
        <i class="bi bi-plus-circle-fill"></i> + Naya Item Add Karein
      </button>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Item Details</th>
            <th>Category</th>
            <th>Khareed (CP)</th>
            <th>Bikri (SP)</th>
            <th>Mojooda Stock</th>
            <th class="text-end" style="min-width: 170px;">Action</th>
          </tr>
        </thead>
        <tbody id="stock_table"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Naya Item Modal -->
<div class="modal fade" id="newProductModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white py-2">
        <h5 class="modal-title fw-bold"><i class="bi bi-box-seam"></i> Naya Stock Item</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label small fw-bold">Item Ka Naam <span class="text-danger">*</span></label>
          <input type="text" id="np_name" class="form-control" placeholder="Maslan: Khal Banola, Broiler Feed 14 No">
        </div>
        
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small fw-bold">Category</label>
            <select id="np_cat" class="form-select">
              <option value="Feed">Feed / Khal</option>
              <option value="Medicine">Medicine (Dawai)</option>
              <option value="General">General Item</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">Unit (Paimana)</label>
            <select id="np_unit" class="form-select" onchange="onUnitChange()">
              <option value="KG">KG (Kilogram)</option>
              <option value="Packet">Packet</option>
              <option value="Pcs">Pcs (Nang)</option>
              <option value="Bottle">Bottle</option>
              <option value="Vial">Vial / Injection</option>
              <option value="Strip">Strip (Patti)</option>
              <option value="Liter">Liter</option>
            </select>
          </div>
        </div>

        <!-- Khal Special Toggle Switch -->
        <div class="form-check form-switch p-2 bg-light border rounded mb-2" id="khal_toggle_box">
          <input class="form-check-input ms-0 me-2" type="checkbox" id="np_is_khal" onchange="toggleKhalMode()">
          <label class="form-check-label fw-bold text-success small" for="np_is_khal">
            <i class="bi bi-toggle2-on me-1"></i> Yeh Khal Item Hai? (37 KG &amp; 40 KG Dual Option)
          </label>
        </div>

        <!-- 37 KG & 40 KG Dual Bori Box (Sirf toggle ON par aayega) -->
        <div id="khal_dual_box" class="p-2 border rounded bg-success-subtle mb-2" style="display: none;">
          <div class="small fw-bold text-success mb-2"><i class="bi bi-calculator"></i> 37 KG aur 40 KG Boriyon Ka Hisaab:</div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="small text-muted fw-bold">37 KG Wali Boriyan</label>
              <input type="number" id="calc_bags_37" class="form-control form-control-sm" placeholder="Maslan 7" oninput="runDualKhalCalc()">
            </div>
            <div class="col-6">
              <label class="small text-muted fw-bold">40 KG Wali Boriyan</label>
              <input type="number" id="calc_bags_40" class="form-control form-control-sm" placeholder="Maslan 3" oninput="runDualKhalCalc()">
            </div>
          </div>
          <div class="row g-2">
            <div class="col-12">
              <label class="small text-muted fw-bold">Bori Khareed Rate (Average Bori Cost)</label>
              <input type="number" id="calc_bag_cost" class="form-control form-control-sm" placeholder="Maslan 3700" oninput="runDualKhalCalc()">
            </div>
          </div>
        </div>

        <!-- Kul Stock Input -->
        <div class="mb-2">
          <label class="form-label small fw-bold" id="lbl_qty">Kul Stock (Quantity / KG)</label>
          <input type="number" step="any" id="np_qty" class="form-control fw-bold text-success" placeholder="Total wazan ya tadad">
        </div>

        <!-- CP & SP (Khareed aur Bikri Rates) -->
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small fw-bold" id="lbl_cost">Khareed Rate (CP)</label>
            <input type="number" step="any" id="np_cost" class="form-control" placeholder="Cost per KG / Unit">
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold" id="lbl_sale">Bikri Rate (SP)</label>
            <input type="number" step="any" id="np_sale" class="form-control" placeholder="Sale per KG / Unit">
          </div>
        </div>

        <!-- Low Stock Alert -->
        <div class="mb-2">
          <label class="form-label small fw-bold">Low Stock Alert Limit</label>
          <input type="number" id="np_limit" class="form-control" value="20">
        </div>
      </div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-em btn-sm" onclick="saveNewProduct()">Item Save Karein</button>
      </div>
    </div>
  </div>
</div>

<!-- Add More Stock Modal (Live 37 & 40 KG Addition) -->
<div class="modal fade" id="addStockModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white py-2">
        <h5 class="modal-title fw-bold"><i class="bi bi-plus-square"></i> Naya Stock Dakhil Karein</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="as_id">
        <input type="hidden" id="as_is_khal">
        <input type="hidden" id="as_is_kg">
        <h6 class="fw-bold text-dark mb-1" id="as_name">-</h6>
        <div class="small text-muted mb-3" id="as_cur_stock">Mojooda Stock: -</div>

        <!-- Agar Khal ho to 37 & 40 KG dono ka dabba aik sath aayega -->
        <div id="as_khal_dual_box" class="p-2 border rounded bg-success-subtle mb-3" style="display: none;">
          <div class="small fw-bold text-success mb-2"><i class="bi bi-box2-fill"></i> Khal Ki Boriyan Darj Karein:</div>
          <div class="row g-2">
            <div class="col-6">
              <label class="small text-muted fw-bold">37 KG Wali Boriyan</label>
              <input type="number" id="as_bags_37" class="form-control" placeholder="0" oninput="calcAddStock()">
            </div>
            <div class="col-6">
              <label class="small text-muted fw-bold">40 KG Wali Boriyan</label>
              <input type="number" id="as_bags_40" class="form-control" placeholder="0" oninput="calcAddStock()">
            </div>
          </div>
        </div>

        <!-- Normal Aam Feed / Dawai ke liye -->
        <div id="as_normal_box" class="mb-3" style="display: none;">
          <label class="form-label small fw-bold" id="as_add_label">Kitni Tadad / Wazan Add Karna Hai?</label>
          <input type="number" step="any" id="as_normal_qty" class="form-control" placeholder="0" oninput="calcAddStock()">
        </div>

        <!-- Total Jo Jama Hoga -->
        <div class="mb-3">
          <label class="form-label small fw-bold">Kul Jama Hone Wala Stock:</label>
          <input type="number" step="any" id="as_total_qty_add" class="form-control fw-bold fs-5 text-success" readonly placeholder="0">
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Nayi Khareed Price (CP) - Optional</label>
          <input type="number" step="any" id="as_new_cost" class="form-control" placeholder="Agar rate badal gaya ho">
        </div>
      </div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-em btn-sm" onclick="submitAddStock()"><i class="bi bi-check-circle"></i> Stock Jama Karein</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Item Modal -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white py-2">
        <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square"></i> Stock Edit Karein</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="ep_id">
        <div class="mb-2">
          <label class="form-label small fw-bold">Item Ka Naam</label>
          <input type="text" id="ep_name" class="form-control">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Total Stock</label>
          <input type="number" step="any" id="ep_qty" class="form-control">
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small fw-bold">Khareed Price (CP)</label>
            <input type="number" step="any" id="ep_cost" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">Bikri Price (SP)</label>
            <input type="number" step="any" id="ep_sale" class="form-control">
          </div>
        </div>
      </div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="updateProduct()">Save Tabdeeli</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
renderNav('stock.html');
let P = [];

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('hide.bs.modal', () => {
    if (document.activeElement && m.contains(document.activeElement)) {
      document.activeElement.blur();
    }
  });
});

function onUnitChange() {
  const unit = document.getElementById('np_unit').value;
  const isKg = (unit === 'KG');
  document.getElementById('khal_toggle_box').style.display = isKg ? 'block' : 'none';
  if (!isKg) {
    document.getElementById('np_is_khal').checked = false;
  }
  toggleKhalMode();
}

function toggleKhalMode() {
  const isKhal = document.getElementById('np_is_khal').checked;
  const unit = document.getElementById('np_unit').value;
  
  if (isKhal) {
    document.getElementById('khal_dual_box').style.display = 'block';
    document.getElementById('lbl_qty').textContent = 'Kul Stock (37KG + 40KG Total KG)';
    document.getElementById('lbl_cost').textContent = 'Khareed Rate (CP/KG)';
    document.getElementById('lbl_sale').textContent = 'Khula Rate (SP/KG)';
    runDualKhalCalc();
  } else {
    document.getElementById('khal_dual_box').style.display = 'none';
    document.getElementById('lbl_qty').textContent = `Kul Stock (${unit})`;
    document.getElementById('lbl_cost').textContent = `Khareed Rate CP (${unit})`;
    document.getElementById('lbl_sale').textContent = `Bikri Rate SP (${unit})`;
  }
}

function runDualKhalCalc() {
  if (!document.getElementById('np_is_khal').checked) return;
  const b37 = +document.getElementById('calc_bags_37').value || 0;
  const b40 = +document.getElementById('calc_bags_40').value || 0;
  const bagCost = +document.getElementById('calc_bag_cost').value || 0;

  const totalKg = (b37 * 37) + (b40 * 40);
  if (totalKg > 0) {
    document.getElementById('np_qty').value = totalKg;
  }
  
  if (bagCost > 0) {
    const costPerKg = (bagCost / 37).toFixed(2);
    document.getElementById('np_cost').value = costPerKg;
    document.getElementById('np_sale').value = (+costPerKg + 10).toFixed(2);
  }
}

async function load() {
  try {
    await requireLogin();
    P = await ok(db.from('kisan_vet_products').select('*').order('name'));
    draw();
  } catch (e) {
    toast(e.message, false);
  }
}

function draw() {
  const q = s.value.toLowerCase();
  stock_table.innerHTML = P.filter(p => p.name.toLowerCase().includes(q)).map(p => {
    const isKg = (p.unit || '').toUpperCase() === 'KG';
    const bagWt = +p.bag_weight || 0;
    const isKhal = (bagWt === 37 || bagWt === 40) || (p.name || '').toLowerCase().includes('khal');
    let stockDisplay = '';

    if (isKg) {
      const totalKg = +p.stock_qty;
      if (isKhal) {
        const b37 = Math.floor(totalKg / 37);
        const b40 = Math.floor(totalKg / 40);
        stockDisplay = `
          <div class="fw-bold text-dark fs-6">${totalKg} KG</div>
          <div class="bag-badge"><i class="bi bi-box2-fill"></i> ~${b37} Bori (37KG) ya ${b40} Bori (40KG)</div>
        `;
      } else {
        stockDisplay = `<div class="fw-bold text-dark fs-6">${totalKg} KG</div><small class="text-muted">Khula / Custom Stock</small>`;
      }
    } else {
      stockDisplay = `
        <div class="fw-bold fs-6 text-dark">${p.stock_qty} <span class="small text-muted">${esc(p.unit)}</span></div>
        <div class="med-badge"><i class="bi bi-capsule"></i> ${esc(p.unit)} Stock</div>
      `;
    }

    return `
      <tr>
        <td>
          <div class="fw-bold text-dark">${esc(p.name)}</div>
          <small class="text-muted">${isKg ? (isKhal ? 'Khal Dual Packing (37/40 KG)' : 'Standard KG Feed') : esc(p.unit) + ' Packaging'}</small>
        </td>
        <td><span class="badge ${p.category === 'Medicine' ? 'bg-info-subtle text-info-emphasis border border-info-subtle' : 'bg-warning-subtle text-warning-emphasis border border-warning-subtle'}">${esc(p.category || 'General')}</span></td>
        <td>${rs(p.cost_price)}</td>
        <td class="fw-bold text-success">${rs(p.sale_price)}</td>
        <td>${stockDisplay}</td>
        <td class="text-end text-nowrap">
          <button class="btn btn-sm btn-outline-success me-1" onclick="openAddStockModal(${p.id})" title="Naya stock add karein">
            <i class="bi bi-plus-lg"></i> Maal Add
          </button>
          <button class="btn btn-sm btn-outline-primary" onclick="openEdit(${p.id})"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" onclick="del(${p.id})"><i class="bi bi-trash"></i></button>
        </td>
      </tr>
    `;
  }).join('') || '<tr><td colspan="6" class="text-center text-muted py-3">Koi item nahi mila</td></tr>';
}

function openAddStockModal(id) {
  const p = P.find(x => x.id === id);
  if (!p) return;

  const isKg = (p.unit || '').toUpperCase() === 'KG';
  const bagWt = +p.bag_weight || 0;
  const isKhal = (bagWt === 37 || bagWt === 40) || (p.name || '').toLowerCase().includes('khal');

  document.getElementById('as_id').value = p.id;
  document.getElementById('as_is_khal').value = isKhal ? '1' : '0';
  document.getElementById('as_is_kg').value = isKg ? '1' : '0';
  document.getElementById('as_name').textContent = p.name;
  document.getElementById('as_cur_stock').textContent = `Mojooda Stock: ${p.stock_qty} ${p.unit}`;
  document.getElementById('as_bags_37').value = '';
  document.getElementById('as_bags_40').value = '';
  document.getElementById('as_normal_qty').value = '';
  document.getElementById('as_total_qty_add').value = '';
  document.getElementById('as_new_cost').value = '';

  if (isKhal) {
    document.getElementById('as_khal_dual_box').style.display = 'block';
    document.getElementById('as_normal_box').style.display = 'none';
  } else {
    document.getElementById('as_khal_dual_box').style.display = 'none';
    document.getElementById('as_normal_box').style.display = 'block';
    document.getElementById('as_add_label').textContent = `Kitne ${p.unit} Stock Mein Add Karne Hain?`;
  }

  new bootstrap.Modal(document.getElementById('addStockModal')).show();
}

function calcAddStock() {
  const isKhal = document.getElementById('as_is_khal').value === '1';
  if (isKhal) {
    const b37 = +document.getElementById('as_bags_37').value || 0;
    const b40 = +document.getElementById('as_bags_40').value || 0;
    document.getElementById('as_total_qty_add').value = (b37 * 37) + (b40 * 40);
  } else {
    document.getElementById('as_total_qty_add').value = +document.getElementById('as_normal_qty').value || 0;
  }
}

async function submitAddStock() {
  const id = +document.getElementById('as_id').value;
  const isKhal = document.getElementById('as_is_khal').value === '1';
  const p = P.find(x => x.id === id);
  const addQty = +document.getElementById('as_total_qty_add').value || 0;
  const newCost = +document.getElementById('as_new_cost').value || 0;

  if (addQty <= 0) return toast('Baraye meharbani boriyan ya tadad darj karein', false);

  const newTotalQty = (+p.stock_qty || 0) + addQty;
  let updateData = { stock_qty: newTotalQty };

  if (newCost > 0) {
    if (isKhal) {
      const costPerKg = +(newCost / 37).toFixed(2);
      updateData.cost_price = costPerKg;
      updateData.sale_price = +(costPerKg + 10).toFixed(2);
    } else {
      updateData.cost_price = newCost;
    }
  }

  try {
    await ok(db.from('kisan_vet_products').update(updateData).eq('id', id));
    toast(`${addQty} ${p.unit} maal kamyabi se stock mein jama ho gaya!`);
    bootstrap.Modal.getInstance(document.getElementById('addStockModal')).hide();
    load();
  } catch (e) {
    toast(e.message, false);
  }
}

async function saveNewProduct() {
  const name = np_name.value.trim();
  const unit = np_unit.value;
  const category = np_cat.value;
  const stock_qty = +np_qty.value || 0;
  const isKhal = document.getElementById('np_is_khal').checked;
  const bag_weight = isKhal ? 37 : 0;
  const cost_price = +np_cost.value || 0;
  const sale_price = +np_sale.value || 0;
  const min_limit = +np_limit.value || 20;

  if (!name) return toast('Item ka naam likhna zaroori hai', false);

  try {
    await ok(db.from('kisan_vet_products').insert([{
      name, unit, category, stock_qty, bag_weight, cost_price, sale_price, min_limit
    }]));
    toast('Item kamyabi se add ho gaya!');
    bootstrap.Modal.getInstance(document.getElementById('newProductModal')).hide();
    load();
  } catch (e) {
    toast(e.message, false);
  }
}

function openEdit(id) {
  const p = P.find(x => x.id === id);
  if (!p) return;

  ep_id.value = p.id;
  ep_name.value = p.name;
  ep_qty.value = p.stock_qty;
  ep_cost.value = p.cost_price;
  ep_sale.value = p.sale_price;

  new bootstrap.Modal(document.getElementById('editProductModal')).show();
}

async function updateProduct() {
  try {
    await ok(db.from('kisan_vet_products').update({
      name: ep_name.value.trim(),
      stock_qty: +ep_qty.value || 0,
      cost_price: +ep_cost.value || 0,
      sale_price: +ep_sale.value || 0
    }).eq('id', ep_id.value));
    toast('Stock update ho gaya');
    bootstrap.Modal.getInstance(document.getElementById('editProductModal')).hide();
    load();
  } catch (e) {
    toast(e.message, false);
  }
}

async function del(id) {
  if (!confirm('Kya aap is item ko delete karna chahte hain?')) return;
  try {
    await ok(db.from('kisan_vet_products').delete().eq('id', id));
    toast('Item delete ho gaya');
    load();
  } catch (e) {
    toast(e.message, false);
  }
}

s.oninput = draw;
onUnitChange();
load();
</script>
</body>
</html>
