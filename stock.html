<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stock & Godown - Kisan Vet</title>
  <!-- PWA & Mobile Icon Links -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Mobile Table Responsiveness & Readability Improvements */
    .stock-table {
      min-width: 650px; /* Mobile par columns dabenge nahi, aaram se horizontal scroll honge */
    }
    .stock-table th, .stock-table td {
      vertical-align: middle;
      font-size: 14px;
    }
    .stock-input {
      min-width: 85px;
      font-size: 14px !important;
      font-weight: 600;
      padding: 0.35rem 0.5rem;
    }
    .unit-pill {
      font-size: 12px;
      font-weight: 700;
      background: #e2e8f0;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 3px;
    }
    .item-name-cell {
      min-width: 170px;
    }
  </style>
</head>
<body>
<div class="container py-3">
  
  <!-- Add New Item Card -->
  <div class="card mb-3 shadow-sm border-0">
    <div class="card-body">
      <h5 class="text-em mb-3"><i class="bi bi-plus-circle"></i> Naya Item Add Karein</h5>
      <div class="row g-2">
        <div class="col-md-3 col-12">
          <label class="form-label small fw-semibold d-md-none">Item Name</label>
          <input id="n" class="form-control" placeholder="Item name *">
        </div>
        <div class="col-md-2 col-6">
          <label class="form-label small fw-semibold d-md-none">Category</label>
          <select id="c" class="form-select">
            <option>Medicine</option>
            <option>Feed</option>
          </select>
        </div>
        <div class="col-md-2 col-6">
          <label class="form-label small fw-semibold d-md-none">Unit (pcs, kg, etc.)</label>
          <input id="u" class="form-control" placeholder="Unit * (pcs, kg, etc.)">
        </div>
        <div class="col-md-2 col-4">
          <label class="form-label small fw-semibold d-md-none">Cost Price</label>
          <input id="cp" type="number" class="form-control" placeholder="Cost Price">
        </div>
        <div class="col-md-2 col-4">
          <label class="form-label small fw-semibold d-md-none">Sale Price</label>
          <input id="sp" type="number" class="form-control" placeholder="Sale Price">
        </div>
        <div class="col-md-1 col-4">
          <label class="form-label small fw-semibold d-md-none">Qty</label>
          <input id="q" type="number" class="form-control" placeholder="Qty">
        </div>
        <div class="col-12 mt-2">
          <button class="btn btn-em w-100 fw-semibold py-2" onclick="addItem()">
            <i class="bi bi-plus-lg"></i> Item Stock Mein Shamil Karein
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Input -->
  <div class="input-group mb-3 shadow-sm">
    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
    <input id="s" class="form-control form-control-lg" placeholder="Search stock (name ya unit)...">
  </div>
  
  <!-- Stock Table -->
  <div class="card shadow-sm border-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 stock-table">
        <thead>
          <tr>
            <th class="item-name-cell">Item &amp; Unit</th>
            <th style="width: 100px;">Type</th>
            <th style="width: 110px;">Cost (Rs)</th>
            <th style="width: 110px;">Sale (Rs)</th>
            <th style="width: 110px;">Stock Qty</th>
            <th style="width: 110px;" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="t"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
renderNav('stock.html');
let P = [];

async function load() {
  try {
    P = await ok(db.from('kisan_vet_products').select('*').order('name'));
    draw();
  } catch (e) {
    toast(e.message, false);
  }
}

function draw() {
  const q = s.value.toLowerCase();
  t.innerHTML = P.filter(p => (p.name + ' ' + (p.unit || '')).toLowerCase().includes(q)).map(p => `
    <tr>
      <td class="item-name-cell">
        <div class="fw-bold fs-6 text-dark">${esc(p.name)}</div>
        <span class="unit-pill"><i class="bi bi-box"></i> Unit: ${esc(p.unit || 'pcs')}</span>
      </td>
      <td>
        <span class="badge ${p.category == 'Medicine' ? 'bg-info text-dark' : 'bg-warning text-dark'} px-2 py-1">
          ${p.category}
        </span>
      </td>
      <td>
        <input id="c${p.id}" type="number" class="form-control stock-input" value="${p.cost_price}">
      </td>
      <td>
        <input id="s${p.id}" type="number" class="form-control stock-input" value="${p.sale_price}">
      </td>
      <td>
        <input id="q${p.id}" type="number" step="any" class="form-control stock-input ${p.stock_qty <= p.min_limit ? 'border-danger bg-danger-subtle text-danger' : ''}" value="${p.stock_qty}">
      </td>
      <td class="text-end text-nowrap">
        <button class="btn btn-sm btn-em me-1" onclick="save(${p.id})" title="Save changes">
          <i class="bi bi-save"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="rm(${p.id})" title="Delete item">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">Koi item nahi mila</td></tr>';
}

async function addItem() {
  const name = n.value.trim();
  const unit = u.value.trim();

  if (!name && !unit) {
    return toast('Item ka naam aur unit dono likhna zaroori hai', false);
  }
  if (!name) {
    return toast('Item ka naam likhein', false);
  }
  if (!unit) {
    return toast('Unit (maslan: pcs, kg, litre, packet) likhna zaroori hai', false);
  }

  try {
    await ok(db.from('kisan_vet_products').insert({
      name: name,
      category: c.value,
      unit: unit,
      cost_price: +cp.value || 0,
      sale_price: +sp.value || 0,
      stock_qty: +q.value || 0
    }));

    toast('Item kamyabi se add ho gaya');
    n.value = u.value = cp.value = sp.value = q.value = '';
    load();
  } catch (e) {
    toast(e.message, false);
  }
}

async function save(id) {
  try {
    await ok(db.from('kisan_vet_products').update({
      cost_price: +document.getElementById('c' + id).value || 0,
      sale_price: +document.getElementById('s' + id).value || 0,
      stock_qty: +document.getElementById('q' + id).value || 0
    }).eq('id', id));
    toast('Update ho gaya');
    load();
  } catch (e) {
    toast(e.message, false);
  }
}

async function rm(id) {
  if (!confirm('Yeh item delete karna hai?')) return;
  try {
    await ok(db.from('kisan_vet_products').delete().eq('id', id));
    toast('Delete ho gaya');
    load();
  } catch (e) {
    toast(e.message, false);
  }
}

s.oninput = draw;
load();
</script>
</body>
</html>
